[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fingerprinted bundles and static game data can be cached hard; the HTML shell must not be.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/cities/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
